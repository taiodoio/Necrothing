<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d1016" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Necrothing — il cimitero degli oggetti morti, in voxel." />
    <title>Necrothing — Cimitero degli oggetti</title>
  </head>
  <body>
    <main id="game" aria-label="Cimitero di Necrothing">
      <canvas id="world" aria-label="Scena di gioco 3D"></canvas>

      <header class="hud-top">
        <button class="player-chip" id="player-chip" aria-label="Profilo del custode">
          <span class="chip-avatar" aria-hidden="true"><i data-icon="keeper"></i></span>
          <span class="chip-body">
            <strong id="hud-name">Custode</strong>
            <small id="hud-rank">Rango 1</small>
            <span class="xp-bar"><i id="hud-xp"></i></span>
          </span>
          <span class="wisp-count"><i class="wisp-icon" data-icon="wisp"></i><span id="hud-wisps">0</span></span>
        </button>
        <div class="hud-right">
          <div class="clock-block">
            <strong id="hud-clock">--:--</strong>
            <small id="hud-weather">Notte</small>
          </div>
          <button class="icon-btn" id="settings-btn" aria-label="Impostazioni"><i data-icon="gear"></i></button>
        </div>
      </header>

      <div class="edit-banner" id="edit-banner" hidden>
        <i data-icon="edit"></i><span>Modifica — tocca un elemento, trascinalo per spostarlo</span>
        <button class="pill" id="edit-done">Fine</button>
      </div>

      <div class="map-tools">
        <button class="icon-btn" id="cam-toggle" aria-label="Cambia vista"><i data-icon="top" id="cam-icon"></i></button>
        <button class="icon-btn" id="recenter" aria-label="Centra sul custode"><i data-icon="target"></i></button>
      </div>

      <nav class="bubble" id="bubble" aria-label="Azioni">
        <button class="fab" id="fab" aria-expanded="false" aria-label="Apri azioni"><i data-icon="shovel" id="fab-icon"></i></button>
        <div class="slots" id="slots">
          <button class="slot" data-act="bury"><i data-icon="bury"></i><small>Seppellisci</small></button>
          <button class="slot" data-act="edit"><i data-icon="edit"></i><small>Modifica</small></button>
          <button class="slot" data-act="inventory"><i data-icon="bag"></i><small>Inventario</small></button>
          <button class="slot" data-act="shop"><i data-icon="shop"></i><small>Bottega</small></button>
          <button class="slot" data-act="photo"><i data-icon="photo"></i><small>Foto</small></button>
          <button class="slot" data-act="gallery"><i data-icon="gallery"></i><small>Galleria</small></button>
        </div>
      </nav>

      <div class="ctx" id="ctx" hidden>
        <div class="ctx-title" id="ctx-title"></div>
        <div class="ctx-actions" id="ctx-actions"></div>
      </div>

      <div class="scrim" id="scrim" hidden></div>
      <section class="drawer" id="drawer" hidden aria-modal="true" role="dialog">
        <header class="drawer-head">
          <button class="icon-btn small" id="drawer-close" aria-label="Chiudi"><i data-icon="close"></i></button>
          <h2 id="drawer-title"></h2>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
        <footer class="drawer-foot" id="drawer-foot" hidden></footer>
      </section>

      <div class="photo-layer" id="photo-layer" hidden>
        <div class="photo-shade"></div>
        <div class="photo-rect" id="photo-rect">
          <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
        </div>
        <div class="photo-bar">
          <button class="pill" id="photo-cancel">Annulla</button>
          <button class="shutter" id="photo-shoot" aria-label="Scatta"></button>
          <span class="photo-hint">Sposta gli angoli</span>
        </div>
      </div>

      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="floaters" id="floaters"></div>
      <section class="debug" id="debug" hidden></section>
      <div class="fatal" id="fatal" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
