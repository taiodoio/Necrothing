<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111310" />
    <meta name="description" content="Un prototipo procedurale del cimitero di Necrothing." />
    <title>Necrothing — Cimitero dimenticato</title>
  </head>
  <body>
    <main id="game" aria-label="Cimitero di Necrothing">
      <canvas id="world" aria-label="Scena di gioco 3D"></canvas>
      <header class="masthead">
        <a class="brand" href="#" aria-label="Necrothing, ricentra il cimitero">
          <span class="brand-mark">N</span>
          <span><strong>NECROTHING</strong><small>IL GIARDINO DELLE OMBRE</small></span>
        </a>
        <div class="header-actions">
          <button class="time-button" id="time-toggle" aria-label="Cambia atmosfera">
            <span class="time-symbol">☾</span><span class="time-label">CREPUSCOLO</span>
          </button>
          <button class="icon-button" id="debug-toggle" aria-label="Mostra statistiche" title="Statistiche">≡</button>
        </div>
      </header>
      <div class="map-hint"><span class="gesture-icon">↔</span><span class="desktop-hint">TRASCINA PER ESPLORARE <i>·</i> ROTELLA PER ZOOM</span><span class="mobile-hint">TRASCINA LA MAPPA · PIZZICA PER ZOOM</span></div>
      <div class="map-controls" aria-label="Navigazione mappa">
        <button class="map-control" id="zoom-in" aria-label="Ingrandisci">+</button>
        <button class="map-control" id="zoom-out" aria-label="Riduci">−</button>
        <button class="map-control reset-control" id="camera-reset" aria-label="Ricentra la mappa">⌖</button>
      </div>
      <aside class="inspector" id="inspector" aria-live="polite" hidden>
        <button class="close-button" id="close-inspector" aria-label="Chiudi">×</button>
        <div class="eyebrow" id="grave-number">MEMORIA · 01</div>
        <h1 id="grave-title">Una memoria quieta</h1>
        <p class="inspector-copy" id="grave-description">La pietra attende una mano gentile.</p>
        <div class="status-line"><span>CONDIZIONE</span><strong id="grave-status">In ordine</strong></div>
        <div class="action-list">
          <button class="action-button" data-action="clean"><span>01</span><b>Riordina la tomba</b><em>✦</em></button>
          <button class="action-button" data-action="neglect"><span>02</span><b>Lascia che il tempo passi</b><em>⌁</em></button>
          <button class="action-button" data-action="decorate"><span>03</span><b>Porta dei fiori</b><em>✿</em></button>
        </div>
        <div class="inspector-foot">Le piccole cure restano, anche al buio.</div>
      </aside>
      <nav class="hud-bottom" aria-label="Visualizzazione del cimitero">
        <div class="display-switches">
          <div class="control-group" role="group" aria-label="Stile del cimitero">
            <button class="segment active" data-style="lowpoly"><span class="segment-symbol">◈</span><span>MINIATURA</span></button>
            <button class="segment" data-style="voxel"><span class="segment-symbol">▦</span><span>VOXEL</span></button>
          </div>
          <div class="control-group camera-group" role="group" aria-label="Vista della mappa">
            <button class="segment active" data-camera="angled"><span class="segment-symbol">◇</span><span>OBLIQUA</span></button>
            <button class="segment" data-camera="top"><span class="segment-symbol">⊞</span><span>DALL’ALTO</span></button>
          </div>
        </div>
      </nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <section class="debug-panel" id="debug-panel" hidden aria-label="Statistiche tecniche"><div><span>FPS</span><b id="fps-value">—</b></div><div><span>DRAW CALLS</span><b id="calls-value">—</b></div><div><span>TRIANGOLI</span><b id="triangles-value">—</b></div><div><span>OGGETTI</span><b id="objects-value">—</b></div></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
