<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuovi sbloccabili (anteprima)</title>
  <!-- Anteprima per la valutazione: NON fa parte del gioco né della build. -->
  <style>
    html, body { margin: 0; background: #1f2925; }
    .tavola { position: relative; display: inline-block; }
    canvas { display: block; }
    .label { position: absolute; z-index: 2; font: 600 15px/1.1 system-ui, sans-serif; letter-spacing: 0.04em; color: #e8cf8c; transform: translate(-50%, 0); white-space: nowrap; }
    #icone { position: absolute; z-index: 3; display: flex; gap: 18px; align-items: center; font: 600 13px system-ui, sans-serif; color: #c9d1cc; }
    #icone .btn { width: 58px; height: 58px; display: grid; place-items: center; background: #161920; box-shadow: inset 0 0 0 3px #07080b, inset 0 0 0 6px #3a3f49; }
    #icone .btn.on { box-shadow: inset 0 0 0 3px #07080b, inset 0 0 0 6px #c9a25c; }
    #icone i { width: 40px; height: 40px; background-size: contain; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="tavola"><div id="etichette"></div><div id="icone"></div></div>
  <script type="module" src="./src/proto/items.ts"></script>
</body>
</html>
