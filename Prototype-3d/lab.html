<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Necrothing — Laboratorio personaggi</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101214; color: #e5dfd4; font: 13px system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .bar button, .bar select { background: #1d2024; color: inherit; border: 1px solid #3a3f45; border-radius: 8px; padding: 8px 10px; font: inherit; }
      .labels { position: fixed; inset: 0; pointer-events: none; }
      .labels span { position: absolute; transform: translate(-50%, 0); font-size: 12px; color: #f1e6cf; text-shadow: 0 1px 2px #000; white-space: nowrap; }
      .row { position: fixed; left: 12px; font: 600 14px system-ui; color: #f1d39c; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="labels" id="labels"></div>
    <div class="bar">
      <select id="set">
        <option value="town">Custode e corteo</option>
        <option value="spooky">Presenze</option>
        <option value="animals">Animali</option>
        <option value="funeral">Scena: funerale</option>
      </select>
      <button id="pose">Posa: idle</button>
      <button id="time">Ora: day</button>
      <button id="compare">Confronto: sì</button>
    </div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
